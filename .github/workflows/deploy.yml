name: Deploy Website to InfinityFree

on:
  push:
    branches:
      - main # Triggers the deployment when you push to the main branch

jobs:
  web-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    
    steps:
    - name: Get latest code
      uses: actions/checkout@v4 # Pulls your code from the repo

    - name: Sync files to InfinityFree
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ftpupload.net
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./ 
        server-dir: /dinau-track.infinityfree.me/htdocs/

                # Tell the script to ignore your server-side config file
        exclude: |
          **/config.local.php
          **/.git*
          **/.git*/**
