<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>DINAU FORM</title>
    <link rel="icon" type="image/png" href="dinau.jpeg">
    <link rel="stylesheet" href="stylesheet.css">
    <script src="Dinau.js" defer></script>
    </head>
    <body>
        <header>
             <img src="dinau.jpeg" alt="Ivansdinau Logo" class="logo">
         <h1>DinauList</h1>
        </header>
        <form id="dinauForm">
            <label for="customer">Customer:</label>
            <label for="customer">Customer Name:</label>
            <input type="text" id="customer" name="customer">
            <label for ="borrowed">Amount Borrowed:</label>
            <input type="number" id="borrowed" name="borrowed">
            <label for="interestRate">Interest Rate (%):</label>
            <input type="number" id="interestRate" name="interestRate">
            <label for ="yetToRepay">Amount Yet to Repay</label>
            <input type="number" id="yetToRepay" name="yetToRepay">
            <label for="interestPaid">AmountPaid:</label>
            <input type="number" id="interestPaid" name="interestPaid">
            <label for="dueDate">Due Date:</label>
            <input type="date" id="dueDate" name="dueDate">
             <div class="buttons">
              <button type="submit">Submit</button>
              <button type="button" id="saveBtn">Save</button>
            </div>   
        </form>
        <a href="table.html" class="btn-link">View Saved Records</a>
        
        <div id="output"></div>
    </body>
</html>
